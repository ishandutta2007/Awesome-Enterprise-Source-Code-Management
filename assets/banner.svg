<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#21262d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8957e5"/>
      <stop offset="50%" stop-color="#3fb950"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c9d1d9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 42px; fill: url(#text-grad); }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #8b949e; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #58a6ff; }
    
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }
    @keyframes pulse {
      0% { opacity: 0.3; }
      50% { opacity: 0.8; }
      100% { opacity: 0.3; }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }

    .floating-bg { animation: float 6s ease-in-out infinite; }
    .pulsing-glow { animation: pulse 4s ease-in-out infinite; }
    .animated-line { stroke-dasharray: 8 8; animation: dash 2s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>

  <!-- Background Dynamic Elements (Behind Text) -->
  <g class="pulsing-glow" opacity="0.4">
    <circle cx="150" cy="80" r="120" fill="#8957e5" opacity="0.15" filter="url(#glow)"/>
    <circle cx="1050" cy="220" r="140" fill="#3fb950" opacity="0.12" filter="url(#glow)"/>
  </g>

  <!-- Animated Grid / Network lines in background -->
  <g opacity="0.25">
    <path class="animated-line" d="M 100 250 L 300 200 L 500 230 L 700 180 L 900 240 L 1100 190" stroke="#58a6ff" stroke-width="2" fill="none"/>
    <path class="animated-line" d="M 50 150 L 250 100 L 450 140 L 850 80 L 1050 130" stroke="#8957e5" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Decorative Pills / Tags (Positioned away from main title) -->
  <g class="floating-bg">
    <rect x="850" y="45" width="130" height="32" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="915" y="66" text-anchor="middle" class="badge-text">Git &amp; SCM</text>

    <rect x="1000" y="45" width="140" height="32" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="1070" y="66" text-anchor="middle" class="badge-text" fill="#3fb950">Enterprise Ready</text>
  </g>

  <!-- Bottom Accent Bar -->
  <rect x="0" y="292" width="1200" height="8" fill="url(#accent)"/>

  <!-- Foreground Content (Text guaranteed prominent & unblocked) -->
  <g transform="translate(60, 0)">
    <!-- Top Chip -->
    <rect x="0" y="45" width="220" height="28" rx="14" fill="#21262d" stroke="#8957e5" stroke-width="1"/>
    <text x="110" y="64" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI" font-weight="600" font-size="12" fill="#d2a8ff">🚀 CURATED ENTERPRISE LIST</text>

    <!-- Main Title -->
    <text x="0" y="130" class="title">Awesome Enterprise Source Code Management</text>
    
    <!-- Subtitle -->
    <text x="0" y="175" class="subtitle">A curated guide to Enterprise Git Platforms, Code Review Tools &amp; Version Control SCMs</text>

    <!-- Category Chips / Indicators -->
    <g transform="translate(0, 210)">
      <rect x="0" y="0" width="140" height="36" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="70" y="23" text-anchor="middle" font-family="-apple-system" font-size="13" font-weight="600" fill="#c9d1d9">☁️ SaaS Solutions</text>

      <rect x="155" y="0" width="165" height="36" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="237" y="23" text-anchor="middle" font-family="-apple-system" font-size="13" font-weight="600" fill="#c9d1d9">🔓 Open-Source SCM</text>

      <rect x="335" y="0" width="175" height="36" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="422" y="23" text-anchor="middle" font-family="-apple-system" font-size="13" font-weight="600" fill="#c9d1d9">📊 Market &amp; Pricing Info</text>
    </g>
  </g>
</svg>
